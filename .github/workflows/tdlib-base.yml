name: TDLib Base Image

on:
  push:
    branches: [ main ]
    paths:
      - Dockerfile
      - Dockerfile.tdlib
      - .github/workflows/tdlib-base.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tdlib-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image names
        id: image_names
        shell: bash
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve TDLib version
        id: tdlib
        run: echo "commit=$(sed -n 's/^ARG TDLIB_COMMIT=//p' Dockerfile | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image_names.outputs.owner }}/rails_luoxu_api-tdlib
          tags: |
            type=raw,value=${{ steps.tdlib.outputs.commit }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push tdlib base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.tdlib
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            TDLIB_COMMIT=${{ steps.tdlib.outputs.commit }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=tdlib-base
          cache-to: type=gha,mode=max,scope=tdlib-base
